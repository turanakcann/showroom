services:
  showroom:
    build: .
    restart: unless-stopped
    environment:
      SHOWROOM_HTTPS: "1"
    volumes:
      - showroom_data:/app/var
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - showroom
    environment:
      SHOWROOM_DOMAIN: ${SHOWROOM_DOMAIN:?Set SHOWROOM_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  showroom_data:
  caddy_data:
  caddy_config:
